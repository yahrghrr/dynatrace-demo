# Server port
server.port=8080

# Application name (shows up in Dynatrace as the service name)
spring.application.name=dynatrace-demo

# Show full exception details in HTTP error responses
server.error.include-message=always
server.error.include-exception=true
server.error.include-stacktrace=always

# Spring Boot's built-in error page lives at /error by default, which collides
# with the demo's own GET /error endpoint (the handler would run twice and the
# client would get a Tomcat HTML page). Move the internal error page elsewhere.
server.error.path=/internal-error

# Graceful shutdown when systemd stops the service
server.shutdown=graceful
